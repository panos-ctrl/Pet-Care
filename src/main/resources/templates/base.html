<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Pet Care Clinic</title>
    <!-- Απλό Bootstrap για να είναι όμορφο (όπως φαίνεται να χρησιμοποιεί ο καθηγητής από τις κλάσεις form-control, text-center) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<!-- Εδώ θα μπαίνει ο τίτλος (Header) από τις άλλες σελίδες -->
<div layout:fragment="header" class="mb-4 text-center">
</div>

<!-- Εδώ θα μπαίνει το κυρίως περιεχόμενο (Φόρμες) από τις άλλες σελίδες -->
<div layout:fragment="main" class="d-flex justify-content-center">
</div>

</body>
</html>
